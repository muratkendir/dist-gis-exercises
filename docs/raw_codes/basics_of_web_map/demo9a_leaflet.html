<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Leaflet Web Map Client - WMS & GetFeatureInfo</title>
    <!-- Import Leaflet CSS Library -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <!-- Reference local CSS file for styling -->
    <link rel="stylesheet" href="demo9a.css">
</head>
<body>
    <!-- Map Target Div -->
    <div id="map"></div>
    
    <!-- Top-Right Info Box for GetFeatureInfo Content -->
    <div id="topright_box">
        <strong>WMS Feature Info:</strong>
        <div id="content">Click on a Munich recycling yard to query data...</div>
    </div>

    <!-- Import Leaflet JS Library Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <!-- Reference local Javascript application logic -->
    <script src="demo9a.js"></script>
</body>
</html>
